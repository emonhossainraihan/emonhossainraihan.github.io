baseURL: "https://emonhossainraihan.github.io/"
title: Emon Hossain
languageCode: en
timeZone: Asia/Dhaka
pagination:
  disableAliases: false
  pagerSize: 12
  path: page
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
  tag: tags

menu:
  main:
    - name: Teaching
      url: teaching/
      weight: 1
    - name: Research
      url: papers/
      weight: 2
    - name: Notes
      url: blog/
      weight: 3
    - name: About
      url: about/
      weight: 4

params:
  description: "Emon Hossain, Lecturer in Mathematics at BRAC University, Dhaka. Research in geometry and algebra, teaching resources, and mathematical notes."
  author: Emon Hossain
  images: [picture.jpeg]
  # googleAnalyticsID: "G-XXXXX"
  DateFormat: "January 2006"
  defaultTheme: light
  hideFooter: false
  disableThemeToggle: true
  ShowShareButtons: false
  ShowReadingTime: false
  disableSpecial1stPost: true
  disableAnchoredHeadings: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: false
  ShowToc: false
  disableScrollToTop: true
  TocOpen: true
  ShowWordCount: false
  UseHugoToc: true
  comments: false
  math: true
  socialIcons:
    - name: Email
      url: mailto:mdemon7475@gmail.com
    - name: CV
      url: cv.pdf
    - name: Google Scholar
      url: https://scholar.google.com/citations?user=H81ncQcAAAAJ
    - name: Location
      url: location/
    - name: Office Hours
      url: officehours/
    - name: GitHub
      url: https://github.com/emonhossainraihan
    - name: YouTube
      url: https://www.youtube.com/@emonhossainraihan
    - name: Blog
      url: https://medium.com/@emonhossainraihan

  assets:
    theme_color: "#fbfaf7"
    disableHLJS: true
    disableScrollBarStyle: true
  cover:
    hiddenInList: false
    hiddenInSingle: true
  label:
    text: "Emon Hossain"
    icon: favicon.ico
    iconHeight: 18

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
            - ['\begin{equation}', '\end{equation}']
            - ['\begin{equation*}', '\end{equation*}']
            - ['\begin{align}', '\end{align}']
            - ['\begin{align*}', '\end{align*}']
            - ['\begin{gather}', '\end{gather}']
            - ['\begin{gather*}', '\end{gather*}']
            - ['\begin{multline}', '\end{multline}']
            - ['\begin{multline*}', '\end{multline*}']
          inline:
            - ['\(', '\)']
            - ['$', '$']
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    style: autumn
  tableOfContents:
    endLevel: 2
    ordered: false
    startLevel: 2
