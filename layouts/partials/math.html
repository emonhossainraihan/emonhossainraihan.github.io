{{- /* Configure before loading MathJax; keep these delimiters in sync with config.yml. */ -}}
<script>
  window.MathJax = {
    loader: {load: ['[tex]/amscd', '[tex]/mhchem', 'ui/safe']},
    tex: {
      inlineMath: [['\\(', '\\)'], ['$', '$']],
      displayMath: [['\\[', '\\]'], ['$$', '$$']],
      processEscapes: true,
      processEnvironments: true,
      tags: 'ams',
      packages: {'[+]': ['amscd', 'mhchem']}
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js"></script>
