<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="wordmark" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>
      <span class="monogram" aria-hidden="true">eh.</span>
      <span>{{ site.Title }}</span>
    </a>
    <ul class="nav-links">
      {{- $current := . -}}
      {{- range site.Menus.main -}}
      {{- $active := or (eq $current.RelPermalink (.URL | relURL)) (and (ne .URL "/") (hasPrefix $current.RelPermalink (.URL | relURL))) -}}
      <li><a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
      <li><a class="nav-cv" href="{{ "cv.pdf" | relURL }}">CV <span aria-hidden="true">↗</span></a></li>
    </ul>
  </nav>
</header>
